spring:
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: update

youdao:
  app-key: YOUR_APP_KEY
  app-secret: YOUR_APP_SECRET

server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/vocab_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;WRITE_DELAY=0
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${spring.datasource.url}
    username: ${spring.datasource.username:postgres}
    password: ${spring.datasource.password}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
